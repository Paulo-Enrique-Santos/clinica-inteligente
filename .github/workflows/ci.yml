name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execucoes antigas do mesmo branch: nao adianta esperar CI de commit que ja foi
# substituido.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Le a versao do global.json, para CI e maquina local nao divergirem.
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore backend/Clinica.sln

      - name: Compilar
        # Warning e erro aqui (ver backend/Directory.Build.props). Foi assim que uma
        # vulnerabilidade alta em dependencia transitiva apareceu antes de virar problema.
        run: dotnet build backend/Clinica.sln --configuration Release --no-restore

      - name: Testes
        # Inclui o gate de isolamento entre tenants. Os testes sobem Postgres via
        # Testcontainers — o runner do GitHub ja tem Docker disponivel.
        run: dotnet test backend/Clinica.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar
        run: npm ci

      - name: Gerar tipos de rota
        # PageProps e LayoutProps sao gerados pelo Next em .next/types, que nao vai
        # para o repositorio. Sem este passo o tsc nao os encontra no runner — o que
        # nao aparece na maquina de quem ja rodou o dev server.
        run: npx next typegen

      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint
        # `next lint` foi removido no Next 16; o ESLint roda direto.
        run: npx eslint .

      - name: Build
        # Valores de fachada: o build nao fala com o Keycloak nem com a API, mas o
        # modulo de autenticacao le estas variaveis ao ser importado.
        env:
          AUTH_SECRET: build-only-nao-e-segredo-real
          AUTH_URL: http://localhost:3000
          AUTH_TRUST_HOST: "true"
          AUTH_KEYCLOAK_ID: clinica-web
          AUTH_KEYCLOAK_SECRET: build-only
          AUTH_KEYCLOAK_ISSUER: http://localhost:8080/realms/clinica
          API_BASE_URL: http://localhost:5231
          APP_BASE_URL: http://localhost:3000
        run: npm run build
