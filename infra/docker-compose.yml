name: clinica-inteligente

# Stack de desenvolvimento local.
# Subir com:  docker compose --env-file .env up -d     (a partir de infra/)
#
# Nota sobre o Postgres: usamos a imagem pgvector/pgvector desde a Fase 0, mesmo sem RAG
# ainda, para nao ter que trocar a imagem (e recriar o volume) la na Fase 7.

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: clinica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # Consumidas pelo script de init:
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_OWNER: ${APP_DB_OWNER}
      APP_DB_OWNER_PASSWORD: ${APP_DB_OWNER_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_USER_PASSWORD: ${APP_DB_USER_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Roda apenas na PRIMEIRA criacao do volume. Mudou o script? `docker compose down -v`.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: clinica-keycloak
    restart: unless-stopped
    # start-dev: HTTP sem TLS e sem cache distribuido. Adequado para desenvolvimento.
    # Producao (Fase 14) troca para `start` com TLS e hostname real.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # Sem isto, o Keycloak serve o tema em cache e voce edita CSS sem ver
      # diferenca nenhuma — desligar so em desenvolvimento.
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    name: clinica-postgres-data
