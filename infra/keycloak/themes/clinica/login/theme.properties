# Tema de login da Clinica Inteligente.
#
# parent=base: herdamos os templates de TODOS os fluxos (reset de senha, OTP,
# e-mail de verificacao, telas de erro) e sobrescrevemos apenas o template.ftl,
# que e a casca da pagina. Reescrever cada fluxo daria trabalho e, pior, ficaria
# desatualizado a cada upgrade do Keycloak.
#
# import=common/keycloak apenas para o resourcesCommonPath resolver; nao
# importamos o CSS do PatternFly, entao o visual e 100% nosso.
parent=base
import=common/keycloak

locales=pt-BR

styles=css/clinica.css

# --- Mapeamento das classes que os templates do base referenciam --------------
# O base escreve class="${properties.kcInputClass!}"; aqui decidimos o nome real.
kcHtmlClass=cl-html
kcBodyClass=cl-body
kcLoginClass=cl-page

kcHeaderClass=cl-brand
kcHeaderWrapperClass=cl-brand-mark

kcFormCardClass=cl-card
kcFormHeaderClass=cl-card-header
kcContentWrapperClass=cl-content
kcLabelWrapperClass=cl-label-wrap

kcFormGroupClass=cl-group
kcFormSettingClass=cl-group-setting
kcLabelClass=cl-label
kcInputClass=cl-input
kcInputGroup=cl-input-group
kcInputErrorMessageClass=cl-error
kcFormOptionsWrapperClass=cl-options

kcButtonClass=cl-btn
kcButtonPrimaryClass=cl-btn-primary
kcButtonDefaultClass=cl-btn-secondary
kcButtonBlockClass=cl-btn-block
kcButtonLargeClass=cl-btn-lg

kcFormPasswordVisibilityButtonClass=cl-eye
kcFormPasswordVisibilityIconShow=cl-eye-icon
kcFormPasswordVisibilityIconHide=cl-eye-icon-off

kcAlertClass=cl-alert
kcAlertTitleClass=cl-alert-text

kcSignUpClass=cl-info
kcInfoAreaWrapperClass=cl-info-wrap
